basePath: /
definitions:
  assistantsettings.Response:
    properties:
      active_listening_enabled:
        type: boolean
      updated_at:
        type: string
      wake_word:
        type: string
    type: object
  assistantsettings.UpdateInput:
    properties:
      active_listening_enabled:
        type: boolean
      wake_word:
        maxLength: 32
        type: string
    type: object
  auth.Role:
    enum:
    - user
    - admin
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAdmin
  plugin.CatalogSummary:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      required_setup:
        type: boolean
      setup_type:
        $ref: '#/definitions/plugin.SetupType'
      slug:
        type: string
      version:
        type: string
    type: object
  plugin.DetailResponse:
    properties:
      description:
        type: string
      id:
        type: string
      manifest:
        $ref: '#/definitions/plugin.PluginManifest'
      name:
        type: string
      slug:
        type: string
      version:
        type: string
    type: object
  plugin.Executor:
    properties:
      config:
        additionalProperties: {}
        type: object
      type:
        $ref: '#/definitions/plugin.ExecutorType'
    type: object
  plugin.ExecutorType:
    enum:
    - composio
    - http
    - builtin
    type: string
    x-enum-varnames:
    - ExecutorTypeComposio
    - ExecutorTypeHTTP
    - ExecutorTypeBuiltin
  plugin.ManifestArgument:
    properties:
      description:
        type: string
      name:
        type: string
      prompt:
        type: string
      required:
        type: boolean
      type:
        type: string
    type: object
  plugin.PageMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  plugin.PluginManifest:
    properties:
      arguments:
        items:
          $ref: '#/definitions/plugin.ManifestArgument'
        type: array
      confirmation_required:
        type: boolean
      executor:
        $ref: '#/definitions/plugin.Executor'
      required_setup:
        type: boolean
      setup_type:
        $ref: '#/definitions/plugin.SetupType'
      triggers:
        items:
          type: string
        type: array
    type: object
  plugin.RegisterPluginInput:
    properties:
      description:
        maxLength: 2000
        type: string
      manifest:
        $ref: '#/definitions/plugin.PluginManifest'
      name:
        maxLength: 200
        minLength: 2
        type: string
      slug:
        maxLength: 120
        minLength: 2
        type: string
      version:
        maxLength: 64
        minLength: 1
        type: string
    required:
    - manifest
    - name
    - slug
    - version
    type: object
  plugin.SetupType:
    enum:
    - none
    - oauth_google
    - oauth_generic
    - form
    type: string
    x-enum-varnames:
    - SetupTypeNone
    - SetupTypeOAuthGoogle
    - SetupTypeOAuthGeneric
    - SetupTypeForm
  plugin.UpdatePluginInput:
    properties:
      description:
        maxLength: 2000
        type: string
      manifest:
        $ref: '#/definitions/plugin.PluginManifest'
      name:
        maxLength: 200
        minLength: 2
        type: string
      version:
        maxLength: 64
        minLength: 1
        type: string
    required:
    - manifest
    - name
    - version
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta: {}
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  user.CreateUserInput:
    properties:
      email:
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  user.PageMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  user.RefreshInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  user.Response:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/auth.Role'
      updated_at:
        type: string
    type: object
  user.UpdateUserInput:
    properties:
      name:
        maxLength: 120
        minLength: 2
        type: string
    required:
    - name
    type: object
info:
  contact: {}
  description: A scalable, database-agnostic Go backend template.
  title: go_template API
  version: "1.0"
paths:
  /api/admin/plugins:
    post:
      consumes:
      - application/json
      parameters:
      - description: Plugin registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/plugin.RegisterPluginInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/plugin.DetailResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Register a plugin in the catalog (admin only)
      tags:
      - plugins
  /api/admin/plugins/{slug}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Plugin slug
        in: path
        name: slug
        required: true
        type: string
      - description: Plugin update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/plugin.UpdatePluginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/plugin.DetailResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update a catalog plugin (admin only)
      tags:
      - plugins
  /api/admin/users:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Name search
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/user.Response'
                  type: array
                meta:
                  $ref: '#/definitions/user.PageMeta'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List users (admin only)
      tags:
      - admin
  /api/admin/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete a user (admin only)
      tags:
      - admin
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/user.Response'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get any user by ID (admin only)
      tags:
      - admin
  /api/v1/assistant/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/assistantsettings.Response'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get assistant settings
      tags:
      - assistant
    put:
      consumes:
      - application/json
      parameters:
      - description: Settings payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/assistantsettings.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/assistantsettings.Response'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update assistant settings
      tags:
      - assistant
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Authenticate and obtain tokens
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Refresh an access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/user.Response'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Register a new user
      tags:
      - auth
  /api/v1/plugins:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/plugin.CatalogSummary'
                  type: array
                meta:
                  $ref: '#/definitions/plugin.PageMeta'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List plugins in the catalog
      tags:
      - plugins
  /api/v1/plugins/{slug}:
    get:
      parameters:
      - description: Plugin slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/plugin.DetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get a plugin by slug
      tags:
      - plugins
  /api/v1/users/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/user.Response'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get a user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/user.Response'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
