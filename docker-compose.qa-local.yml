# QA-local override: API uses host networking so it can reach postgres/redis via
# published localhost ports. Some Docker environments block container-to-container
# traffic while host port publishing still works (common in nested VMs).
services:
  api:
    network_mode: host
    ports: []
    environment:
      DB_URI: postgres://postgres:postgres@localhost:5432/smart_assistant_api?sslmode=disable
      REDIS_ADDR: localhost:6379
      GOOGLE_OAUTH_TOKEN_URL: http://localhost:18080/token
